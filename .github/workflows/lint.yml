name: Lint and Validate Kubernetes & YAML

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-yaml:
    name: Lint YAML Files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 160}, truthy: disable}}" .

  validate-k8s:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup kubeconform
        uses: yannh/kubeconform-action@v0.1.0
        with:
          k8s_version: "1.30.0"
        continue-on-error: true

      - name: Validate k8s base manifests
        run: |
          echo "Validating k8s directory with kubeconform..."
          which kubeconform && kubeconform -summary -verbose k8s/ || true

      - name: Validate Kustomize builds
        run: |
          kubectl kustomize k8s/base/ > /dev/null
